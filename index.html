<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M2G App</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="M2G">
    
    <link rel="apple-touch-icon" href="assets/m2g_logo.png?v=7">
    <link rel="apple-touch-icon" sizes="152x152" href="assets/m2g_logo.png?v=7">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/m2g_logo.png?v=7">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/m2g_logo.png?v=7">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/m2g_logo.png?v=7">
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"M2G App","short_name":"M2G","start_url":"./index.html","display":"standalone","background_color":"#6a8a73","theme_color":"#6a8a73","icons":[{"src":"assets/m2g_logo.png","sizes":"192x192","type":"image/png"},{"src":"assets/m2g_logo.png","sizes":"512x512","type":"image/png"}]}'>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f3f0e9; --card-bg: #ffffff; --text-color: #1a1a1a;
            --text-sec: #666666; --accent: #6a8a73; --icon-bg: #dbe4de;
            --border: #eeeeee; --shadow: rgba(0,0,0,0.05); --base-size: 16px;
        }
        body.dark-mode {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #ffffff;
            --text-sec: #bbbbbb; --accent: #8ab696; --icon-bg: #2c2c2c;
            --border: #333333; --shadow: rgba(0,0,0,0.5);
        }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            transition: background-color 0.8s ease, color 0.8s ease;
            -webkit-tap-highlight-color: transparent; font-size: var(--base-size);
            overflow-x: hidden;
            padding-bottom: 150px; 
        }

        .header { 
            padding: 40px 20px 20px 20px; 
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .logo-box { 
            width: 60px; height: 60px; background-color: var(--accent); 
            border-radius: 18px; display: flex; align-items: center; justify-content: center; 
            color: white; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
        }
        .welcome-text { font-size: 1.5rem; font-weight: 800; }

        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding-top: 20px;
        }
        .back-btn-circle {
            width: 44px; height: 44px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            color: var(--text-color);
        }
        body.dark-mode .back-btn-circle { background-color: rgba(40, 40, 40, 0.8); }

        #miniplayer {
            position: fixed; bottom: 90px; left: 15px; right: 15px;
            background-color: var(--accent); color: white;
            border-radius: 16px; 
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            z-index: 200; transform: translateY(150px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden; height: 75px;
        }
        #miniplayer.visible { transform: translateY(0); }
        
        .mp-fill-layer {
            position: absolute; top: 0; left: 0; bottom: 0;
            width: 0%; background-color: rgba(255, 255, 255, 0.25);
            z-index: 1; transition: width 0.25s linear; 
        }

        .mp-content-layer {
            position: relative; z-index: 2; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px;
        }
        /* --- ANIMAZIONI TEATRO CELESTE RIPRISTINATE --- */
        #celestial-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 9999; opacity: 0; 
            transition: opacity 1s ease; display: flex; justify-content: center; align-items: flex-end; 
        }
        #celestial-container.active { opacity: 1; }
        .celestial-body { position: absolute; bottom: -150px; font-size: 120px; }
        #sun-icon { color: #FFD700; filter: drop-shadow(0 0 20px orange); z-index: 2; }
        #moon-group { z-index: 1; display: flex; align-items: center; justify-content: center; }
        #moon-icon { color: #F4F6F0; filter: drop-shadow(0 0 15px #87CEEB); font-size: 100px; }
        
        .stars { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; transition: opacity 2s ease; }
        body.dark-mode .stars { opacity: 1; }
        .star { position: absolute; color: white; font-size: 10px; animation: twinkle 1.5s infinite alternate; }
        
        @keyframes twinkle { from { opacity: 0.3; } to { opacity: 1; } }
        @keyframes sunriseMoveUp { 0% { transform: translate(0, 0) scale(0.8); } 100% { transform: translate(0, -40vh) scale(1); } }
        @keyframes moonsetMoveDown { 0% { transform: translate(0, -40vh) scale(1); } 100% { transform: translate(0, 100px) scale(0.8); } }
        @keyframes sunsetMoveDown { 0% { transform: translate(0, -40vh) scale(1); } 100% { transform: translate(0, 100px) scale(0.8); } }
        @keyframes moonriseMoveUp { 0% { transform: translate(0, 0) scale(0.8); } 100% { transform: translate(0, -40vh) scale(1); } }
        
        .animate-sunrise #sun-icon { animation: sunriseMoveUp 2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }
        .animate-sunrise #moon-group { animation: moonsetMoveDown 2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }
        .animate-sunset #sun-icon { animation: sunsetMoveDown 2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }
        .animate-sunset #moon-group { animation: moonriseMoveUp 2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }

        /* --- STILI PAGINE (Corretti) --- */
        .page-overlay { 
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background-color: var(--bg-color); z-index: 100; padding: 20px; 
            overflow-y: auto; opacity: 0; transition: opacity 0.3s ease; padding-bottom: 150px; 
        }
        .page-overlay.visible { opacity: 1; }
        
        .card { 
            background-color: var(--card-bg); border-radius: 22px; padding: 18px; margin-bottom: 15px; 
            display: flex; align-items: center; justify-content: space-between; 
            box-shadow: 0 4px 15px var(--shadow); border: 1px solid var(--border); cursor: pointer; 
        }
        
        .testo-giustificato { text-align: left !important; line-height: 1.7; }
    </style>
</head>
<body>
    <audio id="global-audio" preload="auto"><source src="assets/inno.mp3" type="audio/mpeg"></audio>

    <div id="celestial-container">
        <div class="stars">
            <span class="material-symbols-rounded star" style="top:10%; left:20%;">star</span>
            <span class="material-symbols-rounded star" style="top:30%; left:80%;">star</span>
        </div>
        <span id="sun-icon" class="material-symbols-rounded celestial-body">wb_sunny</span>
        <div id="moon-group" class="celestial-body"><span id="moon-icon" class="material-symbols-rounded">dark_mode</span></div>
    </div>

    <div id="page-home">
        <div class="header">
            <div class="logo-box">M2G</div>
            <div class="welcome-text">Bentornato, <br><span id="user-name-display" style="color:var(--accent)">Utente</span></div>
        </div>
        <div class="container">
            <div class="card" onclick="openLodiPage()">
                <div class="card-left">
                    <div class="icon-box"><img src="assets/sunrise.png" class="asset-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"><span class="material-icons fallback-icon">wb_sunny</span></div>
                    <div class="card-title">Lodi Mattutine</div>
                </div>
                <span class="material-icons" style="color:var(--text-sec)">chevron_right</span>
            </div>
            </div>
    </div>
    <div id="page-veglia" class="page-overlay">
        <div class="top-bar">
            <div class="back-btn-circle" onclick="goHome()">
                <span class="material-icons">arrow_back</span>
            </div>
            <h2 style="margin:0; font-size: 1.2rem;">Veglia</h2>
            <div style="width: 44px;"></div>
        </div>
        <div class="veglia-text-container testo-giustificato" id="veglia-content"></div>
    </div>

    <div id="page-lodi" class="page-overlay">
        <div class="top-bar">
            <div class="back-btn-circle" onclick="goHome()">
                <span class="material-icons">arrow_back</span>
            </div>
            <div class="search-box">
                <span>Giorno</span>
                <input type="number" id="lodi-search-input" min="1" max="2" onchange="jumpToLodi(this.value)">
            </div>
        </div>
        <div id="lodi-content-container" style="background:var(--card-bg); padding:30px 20px; border-radius:20px; box-shadow: 0 4px 15px var(--shadow);">
            <h2 id="lodi-title-display" style="text-align:center; color: var(--accent); margin-top:0; margin-bottom: 20px; font-size: 1.4rem;"></h2>
            <div id="lodi-text-display" class="testo-giustificato" style="font-size: 1.05rem;"></div>
            <hr style="border:0; border-top:1px solid var(--border); margin:30px 0 20px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="back-btn-circle" onclick="prevLodi()" style="background-color: var(--icon-bg); color: var(--accent);"><span class="material-icons">chevron_left</span></div>
                <span id="lodi-counter" style="font-weight: bold; color: var(--text-sec);"></span>
                <div class="back-btn-circle" onclick="nextLodi()" style="background-color: var(--icon-bg); color: var(--accent);"><span class="material-icons">chevron_right</span></div>
            </div>
        </div>
    </div>

    <div id="page-canti" class="page-overlay">
        <div class="top-bar">
            <div class="back-btn-circle" onclick="goHome()">
                <span class="material-icons">arrow_back</span>
            </div>
            <div class="search-box">
                <span>N°</span>
                <input type="number" id="canto-search-input" min="1" max="28" onchange="jumpToCanto(this.value)">
            </div>
        </div>
        <div id="canto-content-container" style="background:var(--card-bg); padding:30px 20px; border-radius:20px; box-shadow: 0 4px 15px var(--shadow);">
            <h2 id="canto-title-display" style="text-align:center; color: var(--accent); margin-top:0; margin-bottom: 20px; font-size: 1.4rem;"></h2>
            <div id="canto-text-display" class="testo-giustificato" style="font-size: 1.05rem;"></div>
            <hr style="border:0; border-top:1px solid var(--border); margin:30px 0 20px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="back-btn-circle" onclick="prevCanto()" style="background-color: var(--icon-bg); color: var(--accent);"><span class="material-icons">chevron_left</span></div>
                <span id="canto-counter" style="font-weight: bold; color: var(--text-sec);"></span>
                <div class="back-btn-circle" onclick="nextCanto()" style="background-color: var(--icon-bg); color: var(--accent);"><span class="material-icons">chevron_right</span></div>
            </div>
        </div>
    </div>

    <div id="page-user" class="page-overlay">
        <div class="top-bar">
            <div class="back-btn-circle" onclick="goHome()">
                <span class="material-icons">arrow_back</span>
            </div>
            <h2 style="margin:0; font-size: 1.2rem;">Profilo</h2>
            <div style="width: 44px;"></div>
        </div>
        <div style="text-align: center; margin-top: 10px;">
            <div class="profile-pic-container" style="width:100px; height:100px; margin:0 auto; position:relative;" onclick="document.getElementById('file-input').click()">
                <img id="profile-img" src="assets/user.png" style="width:100%; height:100%; border-radius:50%; object-fit:cover; border:4px solid var(--accent); background:white;" onerror="this.src='assets/user.png'">
                <div style="position:absolute; bottom:0; right:0; background:var(--accent); color:white; border-radius:50%; padding:5px;"><span class="material-icons" style="font-size:1rem">edit</span></div>
            </div>
            <input type="file" id="file-input" accept="image/*" onchange="uploadImage(this)" style="display:none">
            <br><input type="text" id="name-input" placeholder="Il tuo nome" oninput="saveName()">
            <div class="settings-box" style="background:var(--card-bg); border-radius:20px; padding:20px; border:1px solid var(--border); margin-top:20px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <span style="font-weight:bold;">Grandezza Testo</span>
                    <input type="range" id="font-slider" min="14" max="24" value="16" oninput="changeFontSize(this.value)">
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:bold;">Modalità Notte</span>
                    <label class="switch"><input type="checkbox" id="dark-mode-toggle" onchange="handleThemeToggle(this.checked)"><span class="slider"></span></label>
                </div>
            </div>
            <br><div class="card" onclick="openNotes()" style="background:var(--accent); color:white; justify-content:center;"><span class="material-icons" style="margin-right:10px">edit_note</span>NOTE PERSONALI</div>
        </div>
    </div>

    <div id="page-notes" class="page-overlay">
        <div class="top-bar">
            <div class="back-btn-circle" onclick="goUser()">
                <span class="material-icons">arrow_back</span>
            </div>
            <h2 style="margin:0; font-size: 1.2rem;">Note</h2>
            <div style="width: 44px;"></div>
        </div>
        <textarea id="notes-input" style="width:100%; height:300px; border-radius:15px; padding:15px; border:1px solid var(--border); font-family:inherit; font-size:1rem;" placeholder="Scrivi qui i tuoi pensieri..." oninput="saveNotes()"></textarea>
    </div>
    <script>
    // --- DATABASE TESTI: LODI (Testi reali dal Word) ---
    const LODI = [
        {
            num: 1,
            title: "Lodi mattutine - 1 maggio",
            text: `<b>Introduzione</b><br>
<b>V.</b> O Dio, vieni a salvarmi.<br>
<b>R.</b> Signore, vieni presto in mio aiuto.<br>
Gloria al Padre e al Figlio e allo Spirito Santo.<br>
Come era nel principio, e ora e sempre, nei secoli dei secoli. Amen. Alleluia.<br><br>

<b>E’ bello lodarti</b><br>
È bello cantare il Tuo amore,<br>
è bello lodare il Tuo nome.<br>
È bello cantare il Tuo amore,<br>
è bello lodarti, Signore,<br>
è bello cantare a Te! (2 volte)<br><br>

<b>1 ant.</b> Crea in me, o Dio, un cuore puro, rinnova in me uno spirito saldo.<br><br>

<b>Salmo 50</b><br>
Pietà di me, o Dio, secondo la tua misericordia;<br>
nel tuo grande amore cancella il mio peccato.<br>
Lavami da tutte le mie colpe,<br>
mondami dal mio peccato.<br>
Riconosco la mia colpa,<br>
il mio peccato mi sta sempre dinanzi.<br><br>

Contro di te, contro te solo ho peccato,<br>
quello che è male ai tuoi occhi, io l’ho fatto;<br>
perciò sei giusto quando parli,<br>
retto nel tuo giudizio.<br><br>

<b>Orazione Finale</b><br>
Concedi al tuo popolo, o Dio, l’abbondanza dei tuoi doni, perché sia sempre fedele agli impegni del suo battesimo, e viva nella prosperità e nella pace in attesa della gioia eterna. Per il nostro Signore.<br><br>

<b>Conclusione</b><br>
<b>V.</b> Il Signore ci benedica, ci preservi da ogni male, e ci conduca alla vita eterna.<br>
<b>R.</b> Amen.`
        },
        {
            num: 2,
            title: "Lodi mattutine - 2 maggio",
            text: `<b>Introduzione</b><br>
<b>V.</b> O Dio, vieni a salvarmi.<br>
<b>R.</b> Signore, vieni presto in mio aiuto.<br>
Gloria al Padre e al Figlio e allo Spirito Santo.<br>
Come era nel principio, e ora e sempre, nei secoli dei secoli. Amen. Alleluia.<br><br>

<b>Salmo 91</b><br>
È bello dar lode al Signore<br>
e cantare al tuo nome, o Altissimo,<br>
annunziare al mattino il tuo amore,<br>
la tua fedeltà lungo la notte.<br><br>

<b>Orazione Finale</b><br>
O Dio, vera luce e giorno senza tramonto, accogli la lode mattutina del tuo popolo e fa’ che il nostro spirito, libero dalle tenebre della colpa, risplenda nel fulgore della tua venuta. Per il nostro Signore.<br><br>

<b>Conclusione</b><br>
<b>V.</b> Il Signore ci benedica, ci preservi da ogni male, e ci conduca alla vita eterna.<br>
<b>R.</b> Amen.`
        }
    ];

    const VEGLIA_TEXT = `<b>Veglia di Preghiera</b><br><br>Qui puoi inserire tutto il testo della Veglia che abbiamo estratto dal documento Word. La formattazione rimarrà allineata a sinistra e pulita.`;

    const CANTI = [
        { num: 1, title: "Canto di Inizio", text: "<b>Canto di Inizio</b><br><br>Testo completo del primo canto qui..." },
        { num: 2, title: "Inno M2G", text: "<b>Inno</b><br><br>È bello cantare il Tuo amore..." }
    ];
    // --- VARIABILI DI STATO ---
    let currentLodiIndex = 0;
    let currentCantoIndex = 0;
    const audio = document.getElementById('global-audio');

    // --- NAVIGAZIONE ---
    function hideAll() {
        document.querySelectorAll('.page-overlay').forEach(p => {
            p.style.display = 'none';
            p.classList.remove('visible');
        });
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('page-home').style.display = 'none';
    }

    function animatePageEntry(pageId) {
        const page = document.getElementById(pageId);
        page.style.display = 'block';
        setTimeout(() => page.classList.add('visible'), 50);
    }

    function goHome() {
        hideAll();
        document.getElementById('page-home').style.display = 'block';
        document.querySelector('.nav-item:nth-child(1)').classList.add('active');
    }

    function goUser() {
        hideAll();
        animatePageEntry('page-user');
        document.querySelector('.nav-item:nth-child(2)').classList.add('active');
    }

    // --- FUNZIONI DI CARICAMENTO TESTI ---
    function openLodiPage() {
        hideAll();
        renderLodi(0);
        animatePageEntry('page-lodi');
    }
    function renderLodi(index) {
        currentLodiIndex = index;
        const l = LODI[index];
        document.getElementById('lodi-title-display').innerHTML = l.title;
        document.getElementById('lodi-text-display').innerHTML = l.text;
        document.getElementById('lodi-counter').textContent = `${l.num} / ${LODI.length}`;
        document.getElementById('page-lodi').scrollTop = 0;
    }
    function nextLodi() { if(currentLodiIndex < LODI.length-1) renderLodi(currentLodiIndex+1); }
    function prevLodi() { if(currentLodiIndex > 0) renderLodi(currentLodiIndex-1); }

    function openVegliaPage() {
        hideAll();
        document.getElementById('veglia-content').innerHTML = VEGLIA_TEXT;
        animatePageEntry('page-veglia');
    }

    function openCantiPage() {
        hideAll();
        renderCanto(0);
        animatePageEntry('page-canti');
    }
    function renderCanto(index) {
        currentCantoIndex = index;
        const c = CANTI[index];
        document.getElementById('canto-title-display').innerHTML = c.title;
        document.getElementById('canto-text-display').innerHTML = c.text;
        document.getElementById('canto-counter').textContent = `${c.num} / ${CANTI.length}`;
    }

    // --- TEATRO CELESTE & AUDIO ---
    audio.addEventListener('play', () => {
        document.getElementById('celestial-container').classList.add('active');
        updateCelestial();
    });

    audio.addEventListener('pause', () => {
        document.getElementById('celestial-container').classList.remove('active');
    });

    audio.addEventListener('timeupdate', () => {
        updateCelestial();
    });

    function updateCelestial() {
        const progress = audio.currentTime / audio.duration;
        const isDark = document.body.classList.contains('dark-mode');
        
        document.body.classList.remove('animate-sunrise', 'animate-sunset');
        
        if (progress > 0.01 && progress < 0.99) {
            if (!isDark) document.body.classList.add('animate-sunrise');
            else document.body.classList.add('animate-sunset');
        }
    }

    // --- SALVATAGGIO DATI (Local Storage) ---
    function saveName() {
        const name = document.getElementById('name-input').value;
        document.getElementById('user-name-display').textContent = name || "Utente";
        localStorage.setItem('m2g_userName', name);
    }

    function uploadImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('profile-img').src = e.target.result;
                localStorage.setItem('m2g_profilePic', e.target.result);
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function changeFontSize(val) {
        document.documentElement.style.setProperty('--base-size', val + 'px');
        localStorage.setItem('m2g_fontSize', val);
    }

    function handleThemeToggle(isDark) {
        document.body.classList.toggle('dark-mode', isDark);
        localStorage.setItem('m2g_theme', isDark ? 'dark' : 'light');
    }

    function saveNotes() {
        localStorage.setItem('m2g_notes', document.getElementById('notes-input').value);
    }

    function openNotes() { hideAll(); animatePageEntry('page-notes'); }

    // --- CARICAMENTO ALL'AVVIO ---
    window.onload = () => {
        const savedName = localStorage.getItem('m2g_userName');
        if (savedName) {
            document.getElementById('name-input').value = savedName;
            document.getElementById('user-name-display').textContent = savedName;
        }

        const savedPic = localStorage.getItem('m2g_profilePic');
        if (savedPic) document.getElementById('profile-img').src = savedPic;

        const savedFontSize = localStorage.getItem('m2g_fontSize');
        if (savedFontSize) {
            document.getElementById('font-slider').value = savedFontSize;
            changeFontSize(savedFontSize);
        }

        const savedTheme = localStorage.getItem('m2g_theme');
        if (savedTheme === 'dark') {
            document.getElementById('dark-mode-toggle').checked = true;
            document.body.classList.add('dark-mode');
        }

        const savedNotes = localStorage.getItem('m2g_notes');
        if (savedNotes) document.getElementById('notes-input').value = savedNotes;
    };
</script>
</body>
</html>
